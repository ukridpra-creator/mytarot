<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — My Tarot</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0d0820;color:white;font-family:'Sarabun',sans-serif;min-height:100vh;}

    /* LOGIN */
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .login-box{background:rgba(255,255,255,0.04);border:1px solid rgba(212,175,55,0.3);border-radius:24px;padding:40px 32px;width:90%;max-width:360px;text-align:center;}
    .login-title{font-size:22px;font-weight:800;color:#d4af37;margin-bottom:6px;}
    .login-sub{font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:24px;}
    .login-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:14px 16px;color:white;font-size:15px;font-family:'Sarabun',sans-serif;outline:none;text-align:center;letter-spacing:4px;margin-bottom:12px;}
    .login-btn{width:100%;background:linear-gradient(135deg,#7c3aed,#d4af37);border:none;border-radius:12px;padding:14px;color:white;font-size:16px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;}
    .login-err{color:#ef4444;font-size:13px;margin-top:10px;display:none;}

    /* DASHBOARD */
    .dash{display:none;padding:20px;}
    .dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.08);}
    .dash-title{font-size:20px;font-weight:800;color:#d4af37;}
    .dash-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;}
    .refresh-btn{background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.4);border-radius:10px;padding:8px 14px;color:#a855f7;font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;}

    /* STAT CARDS */
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
    .stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;text-align:center;}
    .stat-icon{font-size:24px;margin-bottom:6px;}
    .stat-num{font-size:28px;font-weight:900;color:white;line-height:1;}
    .stat-label{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;}

    /* CHART */
    .section{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:16px;margin-bottom:16px;}
    .section-title{font-size:14px;font-weight:700;color:#d4af37;margin-bottom:14px;}
    canvas{width:100%!important;}

    /* TOP LIST */
    .top-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
    .top-item:last-child{border-bottom:none;}
    .top-rank{font-size:16px;font-weight:900;color:rgba(255,255,255,0.3);width:24px;text-align:center;flex-shrink:0;}
    .top-rank.gold{color:#d4af37;}
    .top-rank.silver{color:#94a3b8;}
    .top-rank.bronze{color:#cd7c3c;}
    .top-name{flex:1;font-size:13px;color:white;}
    .top-bar-wrap{width:100px;background:rgba(255,255,255,0.07);border-radius:4px;height:6px;flex-shrink:0;}
    .top-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,#7c3aed,#a855f7);}
    .top-count{font-size:12px;color:rgba(255,255,255,0.5);width:40px;text-align:right;flex-shrink:0;}

    /* RECENT */
    .recent-item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;}
    .recent-item:last-child{border-bottom:none;}
    .recent-type{color:#a855f7;font-weight:700;margin-bottom:2px;}
    .recent-time{color:rgba(255,255,255,0.3);}

    .loading-txt{text-align:center;color:rgba(255,255,255,0.3);font-size:13px;padding:20px;}
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div style="font-size:48px;margin-bottom:12px;">🔐</div>
    <div class="login-title">Admin Dashboard</div>
    <div class="login-sub">My Tarot — ระบบจัดการค่ะ</div>
    <input class="login-input" type="password" id="pwInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPW()">
    <button class="login-btn" onclick="checkPW()">เข้าสู่ระบบ</button>
    <div class="login-err" id="loginErr">รหัสผ่านไม่ถูกต้องค่ะ</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash">
  <div class="dash-header">
    <div>
      <div class="dash-title">📊 Admin Dashboard</div>
      <div class="dash-sub" id="lastUpdate">กำลังโหลดข้อมูล...</div>
    </div>
    <button class="refresh-btn" onclick="loadData()">🔄 รีเฟรช</button>
  </div>

  <!-- STAT CARDS -->
  <div class="stat-grid">
    <div class="stat-card" style="border-color:rgba(96,165,250,0.3);">
      <div class="stat-icon">👥</div>
      <div class="stat-num" id="statUsers">—</div>
      <div class="stat-label">User ทั้งหมด</div>
    </div>
    <div class="stat-card" style="border-color:rgba(212,175,55,0.3);">
      <div class="stat-icon">📖</div>
      <div class="stat-num" id="statReadings">—</div>
      <div class="stat-label">ยอดดูดวงรวม</div>
    </div>
    <div class="stat-card" style="border-color:rgba(16,185,129,0.3);">
      <div class="stat-icon">📅</div>
      <div class="stat-num" id="statToday">—</div>
      <div class="stat-label">วันนี้</div>
    </div>
    <div class="stat-card" style="border-color:rgba(168,85,247,0.3);">
      <div class="stat-icon">🔥</div>
      <div class="stat-num" id="statWeek">—</div>
      <div class="stat-label">7 วันล่าสุด</div>
    </div>
  </div>

  <!-- CHART -->
  <div class="section">
    <div class="section-title">📈 กราฟยอดดูดวงรายวัน (14 วัน)</div>
    <canvas id="chartCanvas" height="160"></canvas>
  </div>

  <!-- TOP MODES -->
  <div class="section">
    <div class="section-title">🔥 โหมดยอดนิยม Top 10</div>
    <div id="topList"><div class="loading-txt">กำลังโหลด...</div></div>
  </div>

  <!-- RECENT -->
  <div class="section">
    <div class="section-title">🕐 ดูดวงล่าสุด 20 รายการ</div>
    <div id="recentList"><div class="loading-txt">กำลังโหลด...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collectionGroup, getDocs, query, orderBy, limit, where, Timestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const ADMIN_PW = 'mytarot2569';

const firebaseConfig = {
  apiKey:"AIzaSyBMQEsuykNPvV7CsnB36zzmN-wribcd7YM",
  authDomain:"my-tarot67.firebaseapp.com", projectId:"my-tarot67",
  storageBucket:"my-tarot67.firebasestorage.app",
  messagingSenderId:"33661162829", appId:"1:33661162829:web:9e06a7cd5a00d613785304"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

window.checkPW=function(){
  const pw=document.getElementById('pwInput').value;
  if(pw===ADMIN_PW){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('dash').style.display='block';
    loadData();
  } else {
    document.getElementById('loginErr').style.display='block';
    document.getElementById('pwInput').value='';
  }
};

window.loadData=async function(){
  document.getElementById('lastUpdate').textContent='กำลังโหลด...';

  try {
    // ดึง readings ทั้งหมด
    const snap=await getDocs(collectionGroup(db,'readings'));
    const all=[];
    snap.forEach(d=>all.push({...d.data(), uid:d.ref.parent.parent.id}));

    // นับ user unique
    const users=new Set(all.map(r=>r.uid));
    document.getElementById('statUsers').textContent=users.size.toLocaleString();
    document.getElementById('statReadings').textContent=all.length.toLocaleString();

    // วันนี้
    const today=new Date(); today.setHours(0,0,0,0);
    const todayTs=today.getTime();
    const todayCount=all.filter(r=>{
      if(!r.createdAt) return false;
      const t=r.createdAt.toDate ? r.createdAt.toDate().getTime() : 0;
      return t >= todayTs;
    }).length;
    document.getElementById('statToday').textContent=todayCount.toLocaleString();

    // 7 วัน
    const weekAgo=new Date(Date.now()-7*86400000).getTime();
    const weekCount=all.filter(r=>{
      if(!r.createdAt) return false;
      const t=r.createdAt.toDate ? r.createdAt.toDate().getTime() : 0;
      return t >= weekAgo;
    }).length;
    document.getElementById('statWeek').textContent=weekCount.toLocaleString();

    // CHART 14 วัน
    drawChart(all);

    // TOP MODES
    const typeCnt={};
    all.forEach(r=>{
      const t=r.type||'ไม่ระบุ';
      typeCnt[t]=(typeCnt[t]||0)+1;
    });
    const sorted=Object.entries(typeCnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const maxCnt=sorted[0]?sorted[0][1]:1;
    const ranks=['🥇','🥈','🥉'];
    const rankClass=['gold','silver','bronze'];
    document.getElementById('topList').innerHTML=sorted.map(([name,cnt],i)=>`
      <div class="top-item">
        <div class="top-rank ${rankClass[i]||''}">${ranks[i]||i+1}</div>
        <div class="top-name">${name}</div>
        <div class="top-bar-wrap"><div class="top-bar" style="width:${Math.round(cnt/maxCnt*100)}%"></div></div>
        <div class="top-count">${cnt.toLocaleString()}</div>
      </div>`).join('');

    // RECENT 20
    const recent=all
      .filter(r=>r.createdAt)
      .sort((a,b)=>{
        const ta=a.createdAt.toDate?a.createdAt.toDate().getTime():0;
        const tb=b.createdAt.toDate?b.createdAt.toDate().getTime():0;
        return tb-ta;
      }).slice(0,20);

    const thMonths=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    document.getElementById('recentList').innerHTML=recent.map(r=>{
      const d=r.createdAt.toDate?r.createdAt.toDate():new Date();
      const timeStr=`${d.getDate()} ${thMonths[d.getMonth()+1]} ${d.getFullYear()+543} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      return `<div class="recent-item">
        <div class="recent-type">${r.type||'ไม่ระบุ'}</div>
        <div class="recent-time">${timeStr} · ${r.uid.slice(0,8)}...</div>
      </div>`;
    }).join('');

    // timestamp
    const now=new Date();
    document.getElementById('lastUpdate').textContent=`อัปเดตล่าสุด ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} น.`;

  } catch(e){
    console.error(e);
    document.getElementById('lastUpdate').textContent='เกิดข้อผิดพลาดค่ะ';
  }
};

function drawChart(all) {
  const canvas=document.getElementById('chartCanvas');
  const W=canvas.offsetWidth||320;
  canvas.width=W;
  const H=160;
  const ctx=canvas.getContext('2d');

  // สร้าง 14 วัน
  const days=14;
  const labels=[];
  const counts=[];
  const thMonths=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  for(let i=days-1;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const next=new Date(d); next.setDate(next.getDate()+1);
    const cnt=all.filter(r=>{
      if(!r.createdAt) return false;
      const t=r.createdAt.toDate?r.createdAt.toDate().getTime():0;
      return t>=d.getTime() && t<next.getTime();
    }).length;
    labels.push(`${d.getDate()} ${thMonths[d.getMonth()+1]}`);
    counts.push(cnt);
  }

  const maxVal=Math.max(...counts,1);
  const padL=8,padR=8,padT=10,padB=30;
  const gW=W-padL-padR;
  const gH=H-padT-padB;
  const barW=Math.floor(gW/days)-2;

  ctx.clearRect(0,0,W,H);

  // grid lines
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=padT+gH*(1-i/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
  }

  // bars
  counts.forEach((cnt,i)=>{
    const x=padL+i*(gW/days)+(gW/days-barW)/2;
    const barH=Math.max(2,Math.round(cnt/maxVal*gH));
    const y=padT+gH-barH;

    const grad=ctx.createLinearGradient(0,y,0,padT+gH);
    grad.addColorStop(0,'#a855f7');
    grad.addColorStop(1,'#7c3aed40');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.roundRect(x,y,barW,barH,3);
    ctx.fill();

    // count label on top
    if(cnt>0){
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.font='9px Sarabun';
      ctx.textAlign='center';
      ctx.fillText(cnt,x+barW/2,y-3);
    }
  });

  // date labels (ทุก 2 วัน)
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.font='9px Sarabun';
  ctx.textAlign='center';
  labels.forEach((lbl,i)=>{
    if(i%2===0){
      const x=padL+i*(gW/days)+gW/days/2;
      ctx.fillText(lbl,x,H-6);
    }
  });
}
</script>
</body>
</html>
