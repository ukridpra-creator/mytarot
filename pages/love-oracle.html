<!DOCTYPE html>

<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;500&family=Playfair+Display:ital,wght@1,400&display=swap');

  :root {
    --rose: #e8a0b0;
    --rose-deep: #c0607a;
    --rose-light: #f5d0da;
    --blush: #fdf0f3;
    --cream: #fdf8f2;
    --gold: #c9a84c;
    --gold-light: #e8cc80;
    --ink: #2d1820;
    --ink-mid: #6b3848;
    --ink-light: #9b6878;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(160deg, #fdf0f3 0%, #f8e8ef 40%, #fdf5f0 100%);
    min-height: 100vh;
    font-family: 'Noto Sans Thai', sans-serif;
    color: var(--ink);
  }



  /* TOP BAR */
  .topbar { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:10px; padding:10px 16px; background:rgba(255,248,250,0.92); backdrop-filter:blur(14px); border-bottom:1px solid rgba(192,96,122,0.22); }
  .tb-back { width:36px; height:36px; border-radius:50%; background:rgba(192,96,122,0.12); border:1px solid rgba(192,96,122,0.3); display:flex; align-items:center; justify-content:center; color:#c0607a; font-size:17px; text-decoration:none; flex:none; }
  .tb-title { font-size:16px; font-weight:700; color:#c0607a; }
  .tb-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .tb-coin { display:inline-flex; align-items:center; gap:6px; background:linear-gradient(180deg,#fff,#fdeef2); border:1.5px solid #e8cc80; color:#a8801f; font-weight:800; font-size:14px; padding:3px 14px 3px 4px; border-radius:999px; box-shadow:0 2px 10px rgba(201,168,76,0.25); }
  .tb-coin img { width:26px; height:26px; }
  .tb-avatar { width:38px; height:38px; border-radius:50%; border:2px solid #e8a0b0; background:#fff; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; }
  .tb-avatar img { width:100%; height:100%; object-fit:cover; }
  /* BOTTOM NAV */
  body { padding-bottom: 96px; }
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(255,248,250,0.96); backdrop-filter:blur(16px); border-top:1px solid rgba(192,96,122,0.25); display:flex; padding:8px 0 16px; z-index:100; box-shadow:0 -4px 18px rgba(192,96,122,0.12); }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-size:11px; color:#9b6878; font-family:'Noto Sans Thai',sans-serif; }
  .bottom-nav .nav-item > span:first-child { display:block; width:38px; height:38px; font-size:0; line-height:0; color:transparent; background-repeat:no-repeat; background-position:center; background-size:contain; transition:transform .2s; }
  .bottom-nav .nav-item:nth-child(1) > span:first-child { background-image:url(../images/nav/home.webp); }
  .bottom-nav .nav-item:nth-child(2) > span:first-child { background-image:url(../images/nav/history.webp); }
  .bottom-nav .nav-item:nth-child(3) > span:first-child { background-image:url(../images/nav/checkin.webp); }
  .bottom-nav .nav-item:nth-child(4) > span:first-child { background-image:url(../images/nav/coin.webp); }
  .bottom-nav .nav-item:nth-child(5) > span:first-child { background-image:url(../images/nav/profile.webp); }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 10% 10%, rgba(232,160,176,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 90%, rgba(201,168,76,0.08) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .page-wrap { position: relative; z-index: 1; }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    padding: 32px 20px 16px;
  }

  .mascot-wrap {
    width: 100px; height: 100px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--rose-light), #fde8f0);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(192,96,122,0.2);
    overflow: hidden;
  }

  .mascot-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .mascot-placeholder { font-size: 52px; }

  .title-en {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--rose-deep);
    letter-spacing: 4px;
    margin-bottom: 4px;
  }

  .title-th {
    font-family: 'Noto Serif Thai', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(192,96,122,0.2);
  }

  .subtitle {
    font-size: 12px;
    color: var(--ink-light);
    font-weight: 300;
  }

  .coin-bar {
    display: flex; justify-content: center; align-items: center;
    gap: 6px; margin: 12px 0 0;
    font-size: 13px; color: var(--ink-light);
  }

  .coin-count { font-weight: 600; color: var(--gold); font-size: 15px; }

  /* ─── DIVIDER ─── */
  .divider {
    display: flex; align-items: center; gap: 10px;
    padding: 0 24px; margin: 16px 0;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
  }
  .divider span { font-size: 16px; }

  /* ─── STEP LABEL ─── */
  .step-label {
    text-align: center;
    font-size: 12px;
    color: var(--ink-light);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  /* ─── GENDER SELECT ─── */
  .gender-grid {
    display: flex;
    gap: 12px;
    justify-content: center;
    padding: 0 20px;
    margin-bottom: 6px;
  }

  .gender-btn {
    flex: 1; max-width: 140px;
    padding: 14px 10px;
    background: rgba(255,255,255,0.7);
    border: 1.5px solid var(--rose-light);
    border-radius: 16px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: 'Noto Sans Thai', sans-serif;
  }

  .gender-btn .g-icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .gender-btn .g-name { font-size: 14px; font-weight: 500; color: var(--ink); display: block; }

  .gender-btn.selected {
    background: linear-gradient(135deg, var(--rose-deep), #e8708a);
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(192,96,122,0.35);
  }

  .gender-btn.selected .g-name { color: white; }

  /* ─── STATUS SELECT ─── */
  .status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 20px;
    margin-bottom: 6px;
  }

  .status-btn {
    padding: 12px 8px;
    background: rgba(255,255,255,0.7);
    border: 1.5px solid var(--rose-light);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: 'Noto Sans Thai', sans-serif;
  }

  .status-btn .s-icon { font-size: 20px; display: block; margin-bottom: 3px; }
  .status-btn .s-name { font-size: 13px; font-weight: 500; color: var(--ink); display: block; }
  .status-btn .s-desc { font-size: 10px; color: var(--ink-light); display: block; margin-top: 2px; }

  .status-btn.selected {
    background: linear-gradient(135deg, #f5c0d0, var(--rose));
    border-color: var(--rose-deep);
    box-shadow: 0 3px 12px rgba(192,96,122,0.25);
  }

  .status-btn.selected .s-name { color: var(--ink); }

  /* ─── MODE TABS ─── */
  .mode-tabs {
    display: flex; gap: 8px;
    justify-content: center;
    padding: 0 20px;
    margin-bottom: 8px;
  }

  .tab-btn {
    flex: 1; max-width: 110px;
    padding: 10px 6px;
    border: 1.5px solid var(--rose-light);
    border-radius: 12px;
    background: rgba(255,255,255,0.6);
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: 'Noto Sans Thai', sans-serif;
  }

  .tab-btn .tab-icon { font-size: 16px; display: block; margin-bottom: 3px; }
  .tab-btn .tab-name { font-size: 12px; color: var(--ink); display: block; }
  .tab-btn .tab-cost { font-size: 11px; color: var(--gold); display: block; margin-top: 2px; }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--rose-light), #fde0e8);
    border-color: var(--rose-deep);
    box-shadow: 0 3px 12px rgba(192,96,122,0.2);
  }

  .mode-desc {
    text-align: center;
    font-size: 11px;
    color: var(--ink-light);
    margin-bottom: 16px;
    padding: 0 24px;
    min-height: 18px;
    font-style: italic;
  }

  /* ─── DRAW BUTTON ─── */
  .draw-btn-wrap { padding: 0 20px; margin-bottom: 24px; }

  .draw-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--rose-deep), #e8708a);
    border: none;
    border-radius: 50px;
    color: white;
    font-family: 'Noto Serif Thai', serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(192,96,122,0.4);
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .draw-btn:active { transform: scale(0.97); }
  .draw-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ─── CARDS AREA ─── */
  .cards-area { padding: 0 20px; margin-bottom: 20px; }

  .cards-layout-1 { display: flex; justify-content: center; }
  .cards-layout-3 { display: flex; gap: 10px; justify-content: center; }

  .cards-layout-5 {
    display: grid;
    grid-template-areas: ". top ." "left mid right" ". bot .";
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    max-width: 300px;
    margin: 0 auto;
  }

  .card-slot.pos-top    { grid-area: top; }
  .card-slot.pos-left   { grid-area: left; }
  .card-slot.pos-mid    { grid-area: mid; }
  .card-slot.pos-right  { grid-area: right; }
  .card-slot.pos-bot    { grid-area: bot; }

  /* Card flip */
  .card-flip {
    perspective: 600px;
    width: 88px; height: 130px;
    margin: 0 auto;
  }

  .cards-layout-1 .card-flip { width: 130px; height: 188px; }

  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.4,0,.2,1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(192,96,122,0.2);
  }

  .card-back {
    background: linear-gradient(135deg, var(--rose-deep) 0%, #e8708a 50%, var(--rose-light) 100%);
    display: flex; align-items: center; justify-content: center;
  }

  .card-back img { width: 100%; height: 100%; object-fit: cover; }

  .card-back-placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; width: 100%;
    gap: 4px;
  }

  .card-back-icon { font-size: 30px; opacity: 0.7; }
  .cards-layout-1 .card-back-icon { font-size: 42px; }

  .card-back-border {
    position: absolute; inset: 6px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
  }

  .card-front {
    transform: rotateY(180deg);
    background: var(--cream);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8px 6px;
    border: 1.5px solid var(--rose-light);
  }

  .card-front { padding: 0; background: linear-gradient(160deg,#fff0f4,#ffd9e3); }
  .card-front .card-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .card-front .card-cap {
    position:absolute; left:0; right:0; bottom:0;
    padding: 14px 4px 5px;
    background: linear-gradient(to top, rgba(60,10,30,0.82), rgba(60,10,30,0));
    text-align:center; color:#fff;
  }
  .card-front .card-cap .card-name { color:#fff; font-size:9.5px; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .cards-layout-1 .card-front .card-cap .card-name { font-size:13px; }
  .card-front .card-cap .card-pos { color:#ffd6e0; margin-top:1px; font-size:8px; }
  .cards-layout-1 .card-front .card-cap .card-pos { font-size:10px; }

  .card-front .card-level {
    font-size: 16px; margin-bottom: 2px;
  }

  .cards-layout-1 .card-front .card-level { font-size: 22px; }

  .card-front .card-divider {
    width: 28px; height: 1px;
    background: var(--rose); margin: 4px 0;
  }

  .card-front .card-name {
    font-family: 'Noto Serif Thai', serif;
    font-size: 10px; font-weight: 600;
    color: var(--ink); text-align: center;
    line-height: 1.4;
  }

  .cards-layout-1 .card-front .card-name { font-size: 12px; }

  .card-front .card-pos {
    font-size: 9px; color: var(--rose-deep);
    margin-top: 4px; font-weight: 500;
  }

  /* ─── READING ─── */
  .reading-wrap {
    margin: 0 20px 32px;
    background: rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 20px 18px;
    border: 1px solid var(--rose-light);
    box-shadow: 0 4px 20px rgba(192,96,122,0.1);
    display: none;
  }

  .reading-wrap.show { display: block; }

  .reading-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rose-light);
  }

  .reading-header h3 {
    font-family: 'Noto Serif Thai', serif;
    font-size: 14px; font-weight: 600;
    color: var(--rose-deep);
  }

  .reading-text {
    font-size: 14px; line-height: 2.1;
    color: var(--ink); white-space: pre-wrap;
    font-family: 'Noto Sans Thai', sans-serif;
    font-weight: 300;
  }

  .reading-text.sections { white-space: normal; }
  .rsec {
    border-radius: 14px; padding: 14px 14px 12px; margin-bottom: 12px;
    background: rgba(255,240,245,0.7); border-left: 4px solid var(--rose);
  }
  .rsec h4 {
    display:flex; align-items:center; gap:8px;
    font-family:'Noto Serif Thai',serif; font-size:13px; font-weight:600;
    color: var(--rose-deep); margin-bottom:6px;
  }
  .rsec h4 img { width:34px; height:50px; object-fit:cover; border-radius:5px; box-shadow:0 2px 6px rgba(192,96,122,.3); }
  .rsec h4 small { display:block; font-weight:400; font-size:11px; color:#9b6878; }
  .rsec p { font-size:14px; line-height:2; font-weight:300; color:var(--ink); }
  .rsec.together { background: rgba(255,248,225,0.8); border-color: var(--gold); }
  .rsec.together h4 { color:#a8801f; }
  .rsec.advice { background: rgba(255,228,236,0.85); border-color: var(--rose-deep); }
  .rsec.advice h4 { color: var(--rose-deep); }

  .reading-loading {
    text-align: center; padding: 20px;
    color: var(--rose-deep); font-size: 13px;
  }

  .dots span { animation: blink 1.2s infinite; display: inline-block; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%,80%,100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  /* ─── MODAL ─── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(45,24,32,0.6); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal-box {
    background: white; border-radius: 24px;
    padding: 32px 24px; text-align: center;
    width: 85%; max-width: 320px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  }

  .modal-box h3 {
    font-family: 'Noto Serif Thai', serif;
    font-size: 17px; margin-bottom: 8px; color: var(--ink);
  }

  .modal-box p {
    font-size: 13px; color: var(--ink-light);
    margin-bottom: 20px; line-height: 1.8;
  }

  .btn-google {
    width: 100%; padding: 12px;
    background: white;
    border: 1.5px solid var(--rose-light);
    border-radius: 50px;
    font-family: 'Noto Sans Thai', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .btn-close-modal {
    margin-top: 12px; background: none; border: none;
    color: var(--ink-light); font-size: 13px; cursor: pointer;
    font-family: 'Noto Sans Thai', sans-serif;
  }

  /* ─── PETAL ─── */
  .petal {
    position: fixed; pointer-events: none; z-index: 50;
    font-size: 14px;
    animation: petalFall linear forwards;
  }

  @keyframes petalFall {
    0%   { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 1; }
    100% { transform: translateY(100vh) rotate(480deg) translateX(30px); opacity: 0; }
  }

  /* ─── REFINED LOOK ─── */
  .mascot-wrap { width:116px; height:116px; border:3px solid #fff; box-shadow:0 0 0 1.5px var(--gold-light), 0 8px 30px rgba(192,96,122,0.28); }
  .title-th { font-size:30px; margin:2px 0 6px; background:linear-gradient(135deg,#a8446a,#c9a84c); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; }
  .subtitle { letter-spacing:1.5px; }
  .coin-bar { background:rgba(255,255,255,.75); border:1px solid var(--rose-light); border-radius:50px; padding:6px 16px; width:max-content; margin:14px auto 0; }
  .coin { width:18px; height:18px; flex:none; vertical-align:-4px; }
  .tab-cost .coin { width:13px; height:13px; vertical-align:-2px; }

  .step-head { display:flex; align-items:center; justify-content:center; gap:10px; margin:26px 20px 12px; }
  .step-head::before, .step-head::after { content:''; flex:1; max-width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold-light)); }
  .step-head::after { transform:scaleX(-1); }
  .step-no { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,var(--rose-deep),#e8708a); color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(192,96,122,.35); }
  .step-title { font-family:'Noto Serif Thai',serif; font-size:14px; font-weight:600; color:var(--ink-mid); }

  .gender-btn:hover, .status-btn:hover, .tab-btn:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(192,96,122,.18); }
  .gender-btn .g-icon, .status-btn .s-icon { display:flex; align-items:center; justify-content:center; color:var(--rose-deep); margin:0 auto 6px; }
  .gender-btn .g-icon svg { width:30px; height:30px; }
  .status-btn .s-icon svg { width:26px; height:26px; }
  .gender-btn.selected .g-icon { color:#fff; }
  .status-btn.selected { background:linear-gradient(135deg,#fde0e8,#f5c0d0); }

  .tab-stack { display:flex; justify-content:center; height:34px; margin-bottom:6px; align-items:center; }
  .tab-stack b { width:18px; height:27px; border-radius:3px; background:url(../images/love-card-back.webp) center/cover, var(--rose-deep); box-shadow:0 1px 4px rgba(120,30,60,.35); margin-left:-7px; border:1px solid rgba(255,255,255,.7); }
  .tab-stack b:first-child { margin-left:0; }
  .tab-btn.active .tab-name { color:var(--rose-deep); font-weight:600; }
  .mode-desc { font-style:normal; margin-top:4px; }

  .draw-btn { display:flex; align-items:center; justify-content:center; gap:10px; background:linear-gradient(135deg,#b04a68,#e8708a 55%,#d8a35a); letter-spacing:1px; }
  .draw-btn svg { color:#ffe9b0; }

  .card-back-icon { width:34px; height:34px; color:rgba(255,255,255,.8); }
  .card-back-icon svg { width:100%; height:100%; }
  .rh-ico, .rl-ico { display:inline-flex; width:18px; height:18px; color:var(--rose-deep); vertical-align:-3px; }

  { name:"ฤดูใบไม้ผลิ",          level:"💗", kw:"ความรักกำลังผลิบาน เวลาดีมาถึงแล้ว",                   cat:"time",     energy:"good" },
  { name:"พระจันทร์เต็มดวง",    level:"💖", kw:"ความสมบูรณ์ ความรักที่ถึงจุดสูงสุด",                   cat:"time",     energy:"great" }
];

var HEARTSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.5 1 5.4 3.2 1.9-2.2 3.4-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>';

var energyLabel = {
  great: "ดีมาก",
  good:  "ดี",
  mid:   "กลาง",
  warn:  "ระวัง",
  bad:   "แย่มาก"
};

var posLabels1 = ["พลังงานความรักวันนี้"];
var posLabels3 = ["อดีต", "ปัจจุบัน", "อนาคต"];
var posLabels5 = ["รากของเรื่อง", "ความรู้สึกที่ซ่อน", "แก่นแท้", "อุปสรรค", "ทิศทาง"];

var currentMode = 1;
var selectedGender = "";
var selectedGenderLabel = "";
var selectedStatus = "";
var drawnCards = [];

// ─── AUTH ───
onAuthStateChanged(auth, async function(user) {
  currentUser = user;
  if(typeof setupCheckin==='function')setupCheckin(user,'../');
  if (user) {
    var snap = await getDoc(doc(db, "users", user.uid));
    var coins = snap.exists() ? (snap.data().coins || 0) : 0;
    updateCoinUI(coins);
    setAvatarDisplay(snap.exists() ? (snap.data().avatar || "") : "");
  } else {
    updateCoinUI(null);
    setAvatarDisplay("");
  }
});

function setAvatarDisplay(a) {
  var el = document.getElementById("avatarEl");
  if (!el) return;
  if (a && a.indexOf(".png") > -1) el.innerHTML = '<img src="' + a + '" alt="">';
  else el.textContent = "👤";
}
window.openProfileOrLogin = function() {
  if (currentUser) window.location.href = "profile.html"; else loginNow();
};

window.updateCoinUI = function(coins) {
  var el = document.getElementById("coinCount");
  el.textContent = (coins === null || coins === undefined || isNaN(coins)) ? "—" : coins;
};

window.loginGoogle = async function() {
  var provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); closeModal(); } catch(e) {}
};

window.loginNow = function() {
  document.getElementById("loginModal").classList.add("show");
};

window.closeModal = function() {
  document.getElementById("loginModal").classList.remove("show");
};

// ─── GENDER ───
window.selectGender = function(btn, gender, label) {
  document.querySelectorAll(".gender-btn").forEach(function(b) { b.classList.remove("selected"); });
  btn.classList.add("selected");
  selectedGender = gender;
  selectedGenderLabel = label;
  // update reading title
  document.getElementById("readingTitle").textContent = "น้องบอก" + label + "เลยนะคะ...";
};

// ─── STATUS ───
window.selectStatus = function(btn, status) {
  document.querySelectorAll(".status-btn").forEach(function(b) { b.classList.remove("selected"); });
  btn.classList.add("selected");
  selectedStatus = status;
};

// ─── MODE ───
window.selectMode = function(n) {
  currentMode = n;
  document.querySelectorAll(".tab-btn").forEach(function(t, i) {
    t.classList.toggle("active", [1,3,5][i] === n);
  });
  var descs = {
    1: "พลังงานความรักในวันนี้",
    3: "อดีต • ปัจจุบัน • อนาคต ของความรัก",
    5: "ลึกเข้าไปในหัวใจ - ห้ามิติแห่งความรัก"
  };
  document.getElementById("modeDesc").textContent = descs[n];
  document.getElementById("cardsArea").innerHTML = "";
  document.getElementById("readingWrap").classList.remove("show");
  drawnCards = [];
  if (!pickLocked) picked = [];
};

// ─── DRAW ───
var pickPool = [], picked = [], pickLocked = false;

function curPos() { return currentMode === 1 ? posLabels1 : currentMode === 3 ? posLabels3 : posLabels5; }

window.drawCards = function() {
  if (pickLocked) return;
  if (!currentUser) { loginNow(); return; }
  if (!selectedGender) { alert("เลือกเพศก่อนนะคะ"); return; }
  if (!selectedStatus) { alert("เลือกสถานะความรักก่อนนะคะ"); return; }
  document.getElementById("readingWrap").classList.remove("show");
  drawnCards = [];
  picked = [];
  pickPool = allCards.slice().sort(function() { return Math.random() - 0.5; });
  buildPicker();
  document.getElementById("cardsArea").scrollIntoView({ behavior: "smooth", block: "center" });
};

function buildPicker() {
  var fan = "";
  for (var n = 0; n < pickPool.length; n++) {
    fan += '<button class="pick-card" id="pc' + n + '" onclick="pickCard(' + n + ')" aria-label="เลือกไพ่ใบที่ ' + (n + 1) + '"><img src="../images/love-card-back.webp" alt=""></button>';
  }
  document.getElementById("cardsArea").innerHTML =
    '<div class="pick-hint" id="pickHint"></div>' +
    '<div class="pick-slots" id="pickSlots"></div>' +
    '<div class="pick-fanwrap"><div class="pick-scroll" id="pickScroll">' + fan + '</div></div>' +
    '<div class="pick-note"><span class="arr">&#8249;</span> เลื่อนซ้าย-ขวาเพื่อดูไพ่ทั้งหมด <span class="arr r">&#8250;</span></div>' +
    '<div class="reveal-wrap"><button class="reveal-btn" id="revealBtn" onclick="revealCards()" disabled>เปิดไพ่</button></div>';
  updatePicker();
  var sc = document.getElementById("pickScroll");
  setTimeout(function() { sc.scrollTo({ left: 160, behavior: "smooth" }); setTimeout(function() { sc.scrollTo({ left: 0, behavior: "smooth" }); }, 700); }, 500);
}

function updatePicker() {
  var pos = curPos(), slots = "";
  for (var k = 0; k < currentMode; k++) {
    var f = k < picked.length;
    slots += '<div class="pick-slot' + (f ? ' filled' : '') + '"' + (f ? ' onclick="unpickCard(' + k + ')"' : '') + '>' +
      (f ? '<img src="../images/love-card-back.webp" alt=""><i class="x">&times;</i>' : '<span>' + (k + 1) + '</span>') +
      '<small>' + pos[k] + '</small></div>';
  }
  document.getElementById("pickSlots").innerHTML = slots;
  for (var n = 0; n < pickPool.length; n++) {
    document.getElementById("pc" + n).classList.toggle("used", picked.indexOf(n) !== -1);
  }
  var full = picked.length >= currentMode;
  document.getElementById("pickHint").innerHTML = full
    ? 'เลือกครบแล้ว กดปุ่ม <b>เปิดไพ่</b> ได้เลยค่ะ'
    : 'ตั้งใจคิดถึงเรื่องความรัก แล้วเลือกไพ่ที่ใช่ <b>' + currentMode + '</b> ใบ <span>(' + picked.length + '/' + currentMode + ')</span>';
  var rb = document.getElementById("revealBtn");
  rb.disabled = !full;
  rb.classList.toggle("ready", full);
}

window.pickCard = function(n) {
  if (pickLocked || picked.indexOf(n) !== -1 || picked.length >= currentMode) return;
  picked.push(n);
  preloadArt(pickPool[n]);
  updatePicker();
};

window.unpickCard = function(k) {
  if (pickLocked) return;
  picked.splice(k, 1);
  updatePicker();
};

window.revealCards = async function() {
  if (pickLocked || picked.length < currentMode) return;
  pickLocked = true;
  document.getElementById("drawBtn").disabled = true;
  var rb = document.getElementById("revealBtn");
  rb.disabled = true;
  rb.innerHTML = 'น้องกำลังเตรียมไพ่<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
  drawnCards = picked.map(function(i) { return pickPool[i]; });
  await Promise.all(drawnCards.map(preloadArt).concat([sleep(800)]));
  renderCards();
  await sleep(500);
  for (var i = 0; i < drawnCards.length; i++) {
    var inner = document.getElementById("cardInner_" + i);
    if (inner) inner.classList.add("flipped");
    await sleep(650);
  }
  spawnPetals();
  try { await callReading(); }
  finally {
    pickLocked = false;
    var b = document.getElementById("drawBtn");
    b.disabled = false;
    b.lastChild.textContent = " เลือกไพ่ใหม่อีกครั้ง";
  }
};

var artCache = {};
function preloadArt(card) {
  var src = cardArt(card);
  if (!artCache[src]) {
    artCache[src] = new Promise(function(res) {
      var im = new Image();
      im.onload = im.onerror = function() { res(); };
      im.src = src;
      setTimeout(res, 6000);
    });
  }
  return artCache[src];
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

function renderCards() {
  var area = document.getElementById("cardsArea");
  var posLabels = currentMode === 1 ? posLabels1 : currentMode === 3 ? posLabels3 : posLabels5;

  if (currentMode === 1) {
    area.innerHTML = '<div class="cards-layout-1">' + cardHTML(0, posLabels[0]) + '</div>';
  } else if (currentMode === 3) {
    var html = '<div class="cards-layout-3">';
    for (var i = 0; i < 3; i++) html += cardHTML(i, posLabels[i]);
    html += '</div>';
    area.innerHTML = html;
  } else {
    var posClass = ["pos-top","pos-left","pos-mid","pos-right","pos-bot"];
    var html = '<div class="cards-layout-5">';
    for (var i = 0; i < 5; i++) {
      html += '<div class="card-slot ' + posClass[i] + '">' + cardHTML(i, posLabels[i]) + '</div>';
    }
    html += '</div>';
    area.innerHTML = html;
  }
}

function cardArt(card) {
  return "../images/love-cards/" + (allCards.indexOf(card) + 1) + ".webp";
}

function cardHTML(idx, label) {
  var card = drawnCards[idx];
  return '<div class="card-flip">' +
    '<div class="card-inner" id="cardInner_' + idx + '">' +
      '<div class="card-face card-back">' +
        '<img src="../images/love-card-back.webp" alt="card back" ' +
          'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\'">' +
        '<div class="card-back-placeholder" style="display:none">' +
          '<div class="card-back-icon">'+HEARTSVG+'</div>' +
          '<div class="card-back-border"></div>' +
        '</div>' +
      '</div>' +
      '<div class="card-face card-front">' +
        '<img class="card-art" src="' + cardArt(card) + '" alt="' + card.name + '" onerror="this.style.display=\'none\'">' +
        '<div class="card-cap">' +
          '<div class="card-name">' + card.name + '</div>' +
          '<div class="card-pos">' + label + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ─── API CALL ───
async function callReading() {
  var wrap = document.getElementById("readingWrap");
  var textEl = document.getElementById("readingText");
  wrap.classList.add("show");
  textEl.innerHTML = '<div class="reading-loading"><span class="rl-ico">'+HEARTSVG+'</span> น้องกำลังดูไพ่ให้ <span class="dots"><span>.</span><span>.</span><span>.</span></span></div>';

  var serviceMap = { 1: "love-oracle-1", 3: "love-oracle-3", 5: "love-oracle-5" };
  var service = serviceMap[currentMode];
  var posLabels = currentMode === 1 ? posLabels1 : currentMode === 3 ? posLabels3 : posLabels5;

  // check special cards
  var specials = drawnCards.filter(function(c) { return c.special; });
  var specialText = "";
  if (specials.length > 0) {
    specials.forEach(function(c) {
      if (c.special === "third") specialText += "\nไพ่พิเศษ: เงาที่สาม - มีมือที่สามเกี่ยวข้อง ให้เตือนอย่างจริงจัง";
      if (c.special === "fake") specialText += "\nไพ่พิเศษ: หน้ากากรัก - ระวังการคบซ้อน ให้เตือนอย่างชัดเจน";
      if (c.special === "rival") specialText += "\nไพ่พิเศษ: นักล่าหัวใจ - มีคู่แข่งเคลื่อนไหว ให้ระบุความเสี่ยง";
    });
  }

  var cardList = drawnCards.map(function(c, i) {
    return 'ตำแหน่ง [' + posLabels[i] + ']: ' + c.name + ' [' + energyLabel[c.energy] + '] - ' + c.kw;
  }).join("\n");

  var tagGuide = drawnCards.map(function(c, k) {
    return "[C" + (k + 1) + "]\nความหมายไพ่ตำแหน่ง " + posLabels[k] + " (" + c.name + ")";
  }).join("\n");

  var promptText =
    "น้องคือผู้ช่วยดูไพ่ความรัก อบอุ่น เป็นกันเอง เหมือนเพื่อนสนิทที่เข้าใจเรื่องหัวใจ\n" +
    "น้องเรียกตัวเองว่า 'น้อง' และเรียกผู้ถามว่า '" + selectedGenderLabel + "'\n" +
    "ใช้ภาษาไทยธรรมชาติ อ่านง่าย ไม่ทางการเกินไป มีความหวาน\n\n" +
    "สถานะความรักของ" + selectedGenderLabel + ": " + selectedStatus + "\n\n" +
    "ไพ่ที่จั่วได้:\n" + cardList + specialText + "\n\n" +
    "ตอบตามรูปแบบนี้เท่านั้น ห้ามใช้ markdown หรือหัวข้ออื่น โดยเขียนแท็กในบรรทัดของตัวเอง แล้วขึ้นบรรทัดใหม่เขียนเนื้อหาแท็กละ 2-3 ประโยคกระชับ (ห้ามยาวเกิน) และต้องเขียนให้ครบทุกแท็กจนถึง [ADVICE] เสมอ:\n" +
    tagGuide + "\n" +
    "[TOGETHER]\nสิ่งที่ไพ่ทั้งหมดบอกรวมกัน\n" +
    "[ADVICE]\nคำแนะนำจากน้องถึง" + selectedGenderLabel + "\n\n" +
    "ห้ามใช้อีโมจิหรือสัญลักษณ์พิเศษในคำตอบ ทำนายให้ตรงกับสถานะ '" + selectedStatus + "' และพลังงานของไพ่แต่ละใบ เชื่อมความหมายไพ่กับสถานะความรัก";

  try {
    var idToken = await currentUser.getIdToken();

    var res = await fetch("/api/claude", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + idToken
      },
      body: JSON.stringify({
        service: service,
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        messages: [{ role: "user", content: promptText }]
      })
    });

    var newCoins = res.headers.get("X-New-Coin-Balance");
    if (newCoins !== null) updateCoinUI(parseInt(newCoins));

    if (!res.ok) {
      var err = await res.json();
      textEl.textContent = err.error === "insufficient_coins"
        ? "เหรียญไม่พอนะคะ กรุณาเติมเหรียญก่อนเลยค่ะ"
        : "เกิดข้อผิดพลาด ลองใหม่นะคะ";
      return;
    }

    // stream
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var fullText = "";
    var rafPending = false;

    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      var text = decoder.decode(chunk.value, { stream: true });
      fullText += text;
      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(function() { rafPending = false; renderReading(fullText, posLabels); });
      }
    }
    renderReading(fullText, posLabels);

    // save firestore
    await addDoc(collection(db, "users", currentUser.uid, "readings"), {
      type: "เลิฟ ออราเคิล",
      question: drawnCards.map(function(c) { return c.name; }).join(" • "),
      result: historyText(fullText, posLabels),
      cards: drawnCards.map(function(c, i) { return { name: c.name, position: posLabels[i] }; }),
      mode: currentMode,
      gender: selectedGender,
      status: selectedStatus,
      createdAt: serverTimestamp()
    });

  } catch(e) {
    textEl.textContent = "เกิดข้อผิดพลาด กรุณาลองใหม่นะคะ";
    console.error(e);
  }
}

function parseParts(text) {
  var parts = {}, cur = null;
  text.split("\n").forEach(function(line) {
    var t = line.trim();
    var m = t.match(/^\[(C\d|TOGETHER|ADVICE)\]$/);
    if (m) { cur = m[1]; parts[cur] = ""; }
    else if (cur && t) parts[cur] += (parts[cur] ? " " : "") + t;
  });
  return parts;
}

function historyText(text, posLabels) {
  var parts = parseParts(text);
  if (!parts.TOGETHER && !parts.ADVICE && !parts.C1) return text;
  var out = [];
  drawnCards.forEach(function(c, k) {
    if (parts["C" + (k + 1)]) out.push(c.name + " (" + posLabels[k] + ")\n" + parts["C" + (k + 1)]);
  });
  if (parts.TOGETHER) out.push("สิ่งที่ไพ่บอกรวมกัน\n" + parts.TOGETHER);
  if (parts.ADVICE) out.push("คำแนะนำจากน้อง\n" + parts.ADVICE);
  return out.join("\n\n");
}

function renderReading(text, posLabels) {
  var textEl = document.getElementById("readingText");
  var parts = {}, cur = null;
  text.split("\n").forEach(function(line) {
    var t = line.trim();
    var m = t.match(/^\[(C\d|TOGETHER|ADVICE)\]$/);
    if (m) { cur = m[1]; parts[cur] = ""; }
    else if (cur && t) parts[cur] += (parts[cur] ? " " : "") + t;
  });
  if (!parts.TOGETHER && !parts.ADVICE && !parts.C1) {
    textEl.classList.remove("sections");
    textEl.textContent = text;
    return;
  }
  textEl.classList.add("sections");
  textEl.innerHTML = "";
  function add(cls, headHTML, body) {
    if (!body) return;
    var d = document.createElement("div");
    d.className = "rsec " + cls;
    d.innerHTML = "<h4>" + headHTML + "</h4>";
    var p = document.createElement("p");
    p.textContent = body;
    d.appendChild(p);
    textEl.appendChild(d);
  }
  drawnCards.forEach(function(c, k) {
    add("", '<img src="' + cardArt(c) + '" alt="" onerror="this.style.display=\'none\'"><span>' + c.name + '<small>' + posLabels[k] + '</small></span>', parts["C" + (k + 1)]);
  });
  add("together", "สิ่งที่ไพ่บอกรวมกัน", parts.TOGETHER);
  add("advice", "คำแนะนำจากน้อง", parts.ADVICE);
}

// ─── PETALS ───
function spawnPetals() {
  var cols = ["#f5a3b8","#e8708a","#f8c8d4","#e8cc80"];
  for (var i = 0; i < 16; i++) {
    (function(i) {
      setTimeout(function() {
        var p = document.createElement("div");
        p.className = "petal";
        var sz = 8 + Math.random() * 8;
        p.style.width = sz + "px"; p.style.height = (sz * 1.4) + "px";
        p.style.background = cols[Math.floor(Math.random() * cols.length)];
        p.style.left = Math.random() * 100 + "vw";
        p.style.animationDuration = (2.5 + Math.random() * 2) + "s";
        document.body.appendChild(p);
        setTimeout(function() { p.remove(); }, 5000);
      }, i * 120);
    })(i);
  }
}

window.drawCards = drawCards;
window.selectMode = selectMode;
window.selectGender = selectGender;
window.selectStatus = selectStatus;

</script>
