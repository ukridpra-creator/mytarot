<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติดูดวง — My Tarot</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/checkin.js"></script>
  <style>
    body { padding-bottom: 80px; }
    .page-header {
      display:flex; align-items:center; gap:12px;
      padding:16px 20px; border-bottom:1px solid var(--border);
      background:rgba(13,8,32,0.95); backdrop-filter:blur(12px);
      position:sticky; top:0; z-index:100;
    }
    .back-btn {
      width:36px; height:36px; border-radius:50%;
      background:rgba(124,58,237,0.2); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      color:var(--purple-light); font-size:16px; text-decoration:none; flex-shrink:0;
    }
    .page-title { font-size:18px; font-weight:700; color:white; }
    .page-content { padding:20px 20px 40px; }

    /* GUEST */
    .guest-section { text-align:center; padding:80px 20px; }
    .guest-icon { font-size:64px; margin-bottom:16px; }
    .guest-title { font-size:20px; font-weight:800; color:white; margin-bottom:8px; }
    .guest-desc { font-size:14px; color:var(--dim); line-height:1.7; margin-bottom:24px; }
    .btn-login {
      display:inline-flex; align-items:center; gap:10px;
      padding:14px 24px; border-radius:16px;
      background:white; border:none; cursor:pointer;
      font-size:15px; font-weight:700; color:#333;
      font-family:'Sarabun',sans-serif;
    }

    /* LOADING */
    .loading-section { text-align:center; padding:80px 20px; }
    .loading-dots { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
    .loading-dots span { width:10px; height:10px; border-radius:50%; background:var(--purple-light); animation:bounce 1.2s ease-in-out infinite; }
    .loading-dots span:nth-child(2){animation-delay:.2s}
    .loading-dots span:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-10px);opacity:1}}

    /* EMPTY */
    .empty-section { text-align:center; padding:80px 20px; }
    .empty-icon { font-size:64px; margin-bottom:16px; }
    .empty-title { font-size:18px; font-weight:700; color:white; margin-bottom:8px; }
    .empty-desc { font-size:14px; color:var(--dim); }

    /* STATS BAR */
    .stats-bar {
      display:flex; align-items:center; justify-content:space-between;
      background:rgba(124,58,237,0.08); border:1px solid rgba(124,58,237,0.2);
      border-radius:16px; padding:14px 18px; margin-bottom:16px;
    }
    .stats-total { font-size:13px; color:rgba(255,255,255,0.6); }
    .stats-total span { font-size:20px; font-weight:800; color:white; margin-right:4px; }
    .stats-page { font-size:12px; color:var(--dim); }

    /* PAGINATION */
    .pagination {
      display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;
      margin-bottom:16px; scrollbar-width:none;
    }
    .pagination::-webkit-scrollbar { display:none; }
    .page-btn {
      flex-shrink:0; min-width:36px; height:36px; border-radius:10px;
      border:1px solid var(--border); background:rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.5); font-size:13px; font-weight:700;
      font-family:'Sarabun',sans-serif; cursor:pointer; transition:all 0.2s;
      display:flex; align-items:center; justify-content:center; padding:0 10px;
    }
    .page-btn:hover { border-color:rgba(124,58,237,0.5); color:white; }
    .page-btn.active {
      background:linear-gradient(135deg,rgba(124,58,237,0.4),rgba(168,85,247,0.3));
      border-color:var(--purple-light); color:white;
    }
    .page-btn.nav { color:var(--purple-light); }

    /* TYPE COLOR MAP */
    .type-badge {
      font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;
      white-space:nowrap; flex-shrink:0;
    }

    /* HISTORY ITEMS */
    .history-item {
      background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07);
      border-radius:18px; padding:16px; margin-bottom:10px;
      cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden;
    }
    .history-item::before {
      content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
      background:var(--item-color, rgba(124,58,237,0.5));
    }
    .history-item:hover {
      border-color:rgba(124,58,237,0.3);
      background:rgba(124,58,237,0.05);
      transform:translateY(-1px);
    }
    .item-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .item-icon { font-size:18px; flex-shrink:0; }
    .item-type { font-size:13px; font-weight:700; color:white; flex:1; }
    .item-date { font-size:11px; color:var(--dim); flex-shrink:0; }
    .item-question {
      font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:8px;
      display:flex; align-items:center; gap:4px;
    }
    .item-result {
      font-size:13px; color:rgba(255,255,255,0.7); line-height:1.7;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .item-arrow { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.15); font-size:18px; }

    /* DETAIL POPUP */
    .detail-overlay {
      position:fixed; inset:0; z-index:500;
      background:rgba(0,0,0,0.85); display:none;
      align-items:flex-end; justify-content:center;
    }
    .detail-overlay.show { display:flex; }
    .detail-sheet {
      background:linear-gradient(180deg,#1e1035,#0d0820);
      border:1px solid rgba(124,58,237,0.2);
      border-radius:28px 28px 0 0;
      padding:24px 20px 40px; width:100%; max-width:480px;
      max-height:82vh; overflow-y:auto;
    }
    .detail-handle { width:40px; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; margin:0 auto 20px; }
    .detail-top { display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
    .detail-icon { font-size:32px; flex-shrink:0; }
    .detail-meta { flex:1; }
    .detail-type { font-size:16px; font-weight:800; color:white; margin-bottom:4px; }
    .detail-date { font-size:11px; color:var(--dim); margin-bottom:4px; }
    .detail-question { font-size:12px; color:rgba(255,255,255,0.45); }
    .detail-divider { height:1px; background:rgba(255,255,255,0.06); margin:16px 0; }
    .detail-result-label { font-size:11px; color:var(--dim); font-weight:700; letter-spacing:1px; margin-bottom:10px; }
    .detail-result { font-size:14px; color:rgba(255,255,255,0.85); line-height:2; white-space:pre-wrap; }
    .detail-btn-row { display:flex; gap:10px; margin-top:24px; }
    .detail-close {
      flex:1; padding:14px; border-radius:16px;
      background:rgba(255,255,255,0.06); border:1px solid var(--border);
      color:white; font-size:15px; font-family:'Sarabun',sans-serif; cursor:pointer;
    }
    .detail-delete {
      padding:14px 20px; border-radius:16px;
      background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.25);
      color:#f87171; font-size:15px; font-family:'Sarabun',sans-serif; cursor:pointer;
    }
  </style>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, setPersistence, indexedDBLocalPersistence, browserLocalPersistence, onAuthStateChanged, signInWithPopup, GoogleAuthProvider }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, doc, deleteDoc, query, orderBy, limit }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey:"AIzaSyBMQEsuykNPvV7CsnB36zzmN-wribcd7YM",
      authDomain:"my-tarot67.firebaseapp.com", projectId:"my-tarot67",
      storageBucket:"my-tarot67.firebasestorage.app",
      messagingSenderId:"33661162829", appId:"1:33661162829:web:9e06a7cd5a00d613785304"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, indexedDBLocalPersistence).catch(()=>setPersistence(auth, browserLocalPersistence));
    const db = getFirestore(app);
    let currentUser = null;
    let currentDocId = null;
    let allItems = [];
    let currentPage = 1;
    const PER_PAGE = 10;

    // TYPE → icon + color
    const TYPE_META = {
      'ไพ่ทาโรต์':   { icon:'🎴', color:'#a855f7' },
      'tarot':        { icon:'🎴', color:'#a855f7' },
      'Purple Star 紫微斗數': { icon:'⭐', color:'#c084fc' },
      'ปาจื้อ':       { icon:'☯️', color:'#ef4444' },
      'เจาะดวงชะตา': { icon:'🔮', color:'#d4af37' },
      'โทจองบีกยอล': { icon:'🇰🇷', color:'#f59e0b' },
      'กุ้ยก้า 九宮飛星': { icon:'🔯', color:'#d4af37' },
      'ผังลั่วซู':    { icon:'🐉', color:'#f59e0b' },
      'Kabbalah Tree of Life': { icon:'🌳', color:'#6366f1' },
      'Soul Aura Color': { icon:'🔮', color:'#a855f7' },
      'Biorhythm กราฟชีวิต': { icon:'📊', color:'#ef4444' },
      'Chinese Zodiac (ฟรี)': { icon:'🐉', color:'#ef4444' },
      'ราศีอินเดีย':  { icon:'🔯', color:'#10b981' },
      'Nakshatras':   { icon:'⭐', color:'#f59e0b' },
      'Vedic Jyotish':{ icon:'🕉️', color:'#f97316' },
      'ชาติก่อน':    { icon:'🔮', color:'#a855f7' },
      'เลขศาสตร์':   { icon:'🔢', color:'#3b82f6' },
      'เซียมซี':     { icon:'🎋', color:'#8B0000' },
      'ไพ่รูน':      { icon:'ᚱ',  color:'#6366f1' },
      'คำทำนาย':     { icon:'✨', color:'#f59e0b' },
    };

    function getMeta(type) {
      if (!type) return { icon:'✨', color:'#a855f7' };
      for (const key of Object.keys(TYPE_META)) {
        if (type.includes(key)) return TYPE_META[key];
      }
      return { icon:'✨', color:'#a855f7' };
    }

    function formatDate(ts) {
      try {
        const d = ts?.toDate ? ts.toDate() : new Date(ts);
        if (isNaN(d)) return '—';
        return d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      } catch(e) { return '—'; }
    }

    // ── กรอง tag ดิบออกจากผลดูดวง ──
    // หน้าดูดวงหลายหน้าในเว็บใช้ tag แบบ <GREETING>...</GREETING> หรือ [POS1]...[SUMMARY]
    // ในการจัดโครงสร้างคำตอบจาก AI แล้วบันทึกข้อความดิบ (พร้อม tag) ลง Firestore ตรงๆ
    // ฟังก์ชันนี้แปลงข้อความดิบให้อ่านง่าย โดยไม่ต้องแก้ข้อมูลเดิมที่บันทึกไว้แล้วเลย
    function cleanReadingText(raw) {
      if (!raw) return '';
      let text = String(raw);

      // ตัด tag แบบ XML เช่น <GREETING>, </GREETING>, <BODY> ฯลฯ — ปิด tag ให้ขึ้นย่อหน้าใหม่
      text = text.replace(/<\/?[A-Z_]+>/g, (m) => (m.startsWith('</') ? '\n\n' : ''));

      // ตัด tag แบบวงเล็บเหลี่ยม เช่น [GREETING], [POS1], [SUMMARY] — ขึ้นย่อหน้าใหม่ทุกครั้ง
      text = text.replace(/\[[A-Z0-9_]+\]/g, '\n\n');

      // ลบบรรทัดว่างที่ซ้ำเกิน 2 ครั้งติดกันให้เหลือแค่ 1 ช่องว่าง
      text = text.replace(/\n{3,}/g, '\n\n');

      return text.trim();
    }

    // ตัดให้สั้นสำหรับพรีวิวในการ์ด (ไม่ตัดกลางคำ HTML entity)
    function previewText(raw, maxLen) {
      const cleaned = cleanReadingText(raw).replace(/\n+/g, ' ');
      if (cleaned.length <= maxLen) return cleaned;
      return cleaned.slice(0, maxLen).trim() + '…';
    }

    function renderPage(page) {
      currentPage = page;
      const total = allItems.length;
      const totalPages = Math.ceil(total / PER_PAGE);
      const start = (page - 1) * PER_PAGE;
      const end = Math.min(start + PER_PAGE, total);
      const pageItems = allItems.slice(start, end);

      // stats
      document.getElementById('statsTotal').innerHTML = `<span>${total}</span> รายการทั้งหมด`;
      document.getElementById('statsPage').textContent = `หน้า ${page} / ${totalPages}`;

      // pagination
      const pag = document.getElementById('pagination');
      let html = '';
      html += `<button class="page-btn nav" onclick="goPage(${Math.max(1,page-1)})" ${page===1?'disabled':''}>‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn nav" onclick="goPage(${Math.min(totalPages,page+1)})" ${page===totalPages?'disabled':''}>›</button>`;
      pag.innerHTML = html;

      // items
      document.getElementById('historyList').innerHTML = pageItems.map(item => {
        const meta = getMeta(item.type);
        const itemForJson = { ...item, createdAt: item.createdAt?.toDate ? item.createdAt.toDate().toISOString() : item.createdAt };
        return `<div class="history-item" style="--item-color:${meta.color}" onclick='showDetailFromData(${JSON.stringify(JSON.stringify(itemForJson))})'>
          <div class="item-header">
            <div class="item-icon">${meta.icon}</div>
            <div class="item-type">${item.type || 'ดูดวง'}</div>
            <div class="item-date">${formatDate(item.createdAt)}</div>
          </div>
          ${item.question ? `<div class="item-question">📝 ${item.question}</div>` : ''}
          <div class="item-result">${previewText(item.result, 120)}</div>
          <div class="item-arrow">›</div>
        </div>`;
      }).join('');
    }

    window.goPage = function(p) {
      const total = allItems.length;
      const totalPages = Math.ceil(total / PER_PAGE);
      if (p < 1 || p > totalPages) return;
      renderPage(p);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function showDetail(item) {
      currentDocId = item.id;
      const meta = getMeta(item.type);
      document.getElementById('detailIcon').textContent = meta.icon;
      document.getElementById('detailType').textContent = item.type || 'ดูดวง';
      document.getElementById('detailDate').textContent = formatDate(item.createdAt);
      document.getElementById('detailQuestion').textContent = item.question ? `📝 ${item.question}` : '';
      document.getElementById('detailResult').textContent = cleanReadingText(item.result);
      document.getElementById('detailOverlay').classList.add('show');
    }

    window.showDetailFromData = function(itemJson) { showDetail(JSON.parse(itemJson)); };
    window.closeDetail = function() { document.getElementById('detailOverlay').classList.remove('show'); currentDocId = null; };

    window.deleteItem = async function() {
      if (!currentDocId || !currentUser) return;
      if (!confirm('ลบรายการนี้ออกจากประวัติ?')) return;
      try {
        await deleteDoc(doc(db, 'users', currentUser.uid, 'readings', currentDocId));
        closeDetail();
        allItems = allItems.filter(i => i.id !== currentDocId);
        renderPage(Math.min(currentPage, Math.ceil(allItems.length / PER_PAGE) || 1));
      } catch(e) { console.error(e); alert('ลบไม่สำเร็จค่ะ'); }
    };

    async function loadHistory(uid) {
      document.getElementById('loadingSection').style.display = 'block';
      document.getElementById('mainSection').style.display = 'none';
      document.getElementById('emptySection').style.display = 'none';
      try {
        const q = query(collection(db, 'users', uid, 'readings'), limit(500));
        const snap = await getDocs(q);
        allItems = [];
        snap.forEach(d => allItems.push({ id: d.id, ...d.data() }));
        allItems.sort((a, b) => {
          const da = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
          const db2 = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
          return db2 - da;
        });
        document.getElementById('loadingSection').style.display = 'none';
        if (allItems.length === 0) { document.getElementById('emptySection').style.display = 'block'; return; }
        document.getElementById('mainSection').style.display = 'block';
        renderPage(1);
      } catch(e) {
        console.error(e);
        document.getElementById('loadingSection').style.display = 'none';
        document.getElementById('emptySection').style.display = 'block';
      }
    }

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        document.getElementById('guestSection').style.display = 'none';
        loadHistory(user.uid);
        if (typeof setupCheckin === 'function') setupCheckin(user, '../');
      } else {
        document.getElementById('guestSection').style.display = 'block';
        document.getElementById('loadingSection').style.display = 'none';
      }
    });

    window.loginNow = async function() {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch(e) { alert('เข้าสู่ระบบไม่สำเร็จค่ะ'); }
    };
  </script>
</head>
<body>

<!-- DETAIL POPUP -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-sheet">
    <div class="detail-handle"></div>
    <div class="detail-top">
      <div class="detail-icon" id="detailIcon"></div>
      <div class="detail-meta">
        <div class="detail-type" id="detailType"></div>
        <div class="detail-date" id="detailDate"></div>
        <div class="detail-question" id="detailQuestion"></div>
      </div>
    </div>
    <div class="detail-divider"></div>
    <div class="detail-result-label">✦ ผลการดูดวง</div>
    <div class="detail-result" id="detailResult"></div>
    <div class="detail-btn-row">
      <button class="detail-close" onclick="closeDetail()">ปิด</button>
      <button class="detail-delete" onclick="deleteItem()">🗑️ ลบ</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<div class="page-header">
  <a href="../index.html" class="back-btn">←</a>
  <div class="page-title">📜 ประวัติดูดวง</div>
</div>

<div class="page-content">

  <!-- GUEST -->
  <div id="guestSection" style="display:none">
    <div class="guest-section">
      <div class="guest-icon">📜</div>
      <div class="guest-title">เข้าสู่ระบบเพื่อดูประวัติ</div>
      <div class="guest-desc">บันทึกประวัติการดูดวงทั้งหมดของคุณ<br>sync ข้ามอุปกรณ์ได้ทุกที่ค่ะ</div>
      <button class="btn-login" onclick="loginNow()">
        <img src="https://www.google.com/favicon.ico" width="18"> เข้าสู่ระบบด้วย Google
      </button>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loadingSection" style="display:none">
    <div class="loading-section">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <div style="font-size:14px;color:var(--dim)">กำลังโหลดประวัติ...</div>
    </div>
  </div>

  <!-- EMPTY -->
  <div id="emptySection" style="display:none">
    <div class="empty-section">
      <div class="empty-icon">🔮</div>
      <div class="empty-title">ยังไม่มีประวัติดูดวง</div>
      <div class="empty-desc">เริ่มดูดวงแล้วประวัติจะปรากฏที่นี่ค่ะ</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainSection" style="display:none">
    <div class="stats-bar">
      <div class="stats-total" id="statsTotal"></div>
      <div class="stats-page" id="statsPage"></div>
    </div>
    <div class="pagination" id="pagination"></div>
    <div id="historyList"></div>
    <div class="pagination" id="paginationBottom"></div>
  </div>

</div>

<nav class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='../index.html'"><span>🏠</span><span>หน้าหลัก</span></div>
  <div class="nav-item active"><span>📜</span><span>ประวัติ</span></div>
  <div class="nav-item" onclick="openCheckin()"><span>🎁</span><span>เช็คอิน</span></div>
  <div class="nav-item" onclick="window.location.href='coins.html'"><span>🪙</span><span>เหรียญ</span></div>
  <div class="nav-item" onclick="window.location.href='profile.html'"><span>👤</span><span>โปรไฟล์</span></div>
</nav>

</body>
</html>
